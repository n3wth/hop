name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Restore Next's compiler cache so unchanged code isn't rebuilt.
      # https://nextjs.org/docs/pages/guides/ci-build-caching
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # Same gate as local `npm run check`: lint + typecheck + tests.
      # Everything runs keyless — lib/env.ts is lazy and every seam degrades.
      - name: Lint, typecheck, test
        run: npm run check

      - name: Build
        run: npm run build
