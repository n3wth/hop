name: Data Refresh Loop (L3)

on:
  schedule:
    - cron: '0 9 1 * *' # Monthly on the 1st at 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print diff, create no PR)'
        type: boolean
        default: true

concurrency:
  group: data-refresh
  cancel-in-progress: true

jobs:
  data-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ secrets.HOP_BOT_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@39370e3970a6d050c08001b064075cd0dd1b110a # v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate place facts and climate normals
        run: |
          node scripts/gen-place-facts.mjs > lib/place-facts.ts
          node scripts/gen-climate-normals.mjs > lib/climate-normals.ts

      - name: Update CONTENT_LAST_MODIFIED in lib/seo-routes.ts
        run: |
          BEFORE_COUNT=$(grep -c "export const CONTENT_LAST_MODIFIED =" lib/seo-routes.ts)
          if [ "$BEFORE_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 line matching CONTENT_LAST_MODIFIED before replacement, found $BEFORE_COUNT"
            exit 1
          fi
          TODAY=$(date -u +'%Y-%m-%d')
          sed -i.bak "s/export const CONTENT_LAST_MODIFIED = '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}'/export const CONTENT_LAST_MODIFIED = '$TODAY'/" lib/seo-routes.ts
          rm -f lib/seo-routes.ts.bak
          AFTER_COUNT=$(grep -c "export const CONTENT_LAST_MODIFIED =" lib/seo-routes.ts)
          if [ "$AFTER_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 line matching CONTENT_LAST_MODIFIED after replacement, found $AFTER_COUNT"
            exit 1
          fi

      - name: Path guard verification
        run: |
          CHANGED=$(git diff --name-only)
          echo "Changed files:"
          echo "$CHANGED"
          
          # Allow only lib/place-facts.ts, lib/climate-normals.ts, and lib/seo-routes.ts
          FORBIDDEN=$(echo "$CHANGED" | grep -vE '^(lib/place-facts\.ts|lib/climate-normals\.ts|lib/seo-routes\.ts)$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Path guard violation: data refresh modified unallowed files:"
            echo "$FORBIDDEN"
            exit 1
          fi

      - name: Run verification checks
        run: npm run check

      - name: Handle dry run or PR creation
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GH_TOKEN: ${{ secrets.HOP_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run complete. Git diff output:"
            git diff
            exit 0
          fi

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes produced by data refresh scripts."
            exit 0
          fi

          BRANCH="bot/data-refresh"
          git config user.name "hop-bot"
          git config user.email "bot@hop.flights"
          git checkout -B "$BRANCH"
          git add lib/place-facts.ts lib/climate-normals.ts lib/seo-routes.ts
          git commit -m "chore(data): monthly dataset refresh (place facts + climate normals)"
          git push origin "$BRANCH" --force

          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            echo "PR for $BRANCH already exists. Branch force-pushed successfully."
          else
            gh pr create \
              --title "chore(data): monthly dataset refresh" \
              --body "Monthly keyless data refresh generated by \`scripts/gen-place-facts.mjs\` and \`scripts/gen-climate-normals.mjs\`. Verified with \`lib/__tests__/data-snapshot.test.ts\` and \`npm run check\`." \
              --head "$BRANCH" \
              --base main
          fi
