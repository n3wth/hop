name: Publish MCP server to registry

# Publishes server.json to the Official MCP Registry
# (https://registry.modelcontextprotocol.io) using mcp-publisher's GitHub OIDC
# auth mode — no personal credential needed, the workflow's own GitHub Actions
# identity proves ownership of the io.github.n3wth/hop namespace.
# https://github.com/modelcontextprotocol/registry (cmd/publisher/README.md)

on:
  push:
    branches: [main]
    paths:
      - server.json
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to the official MCP registry
        run: ./mcp-publisher publish
